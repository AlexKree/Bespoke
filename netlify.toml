[build]
  functions = "netlify/functions"
  # Produit les variantes WebP servies par le site (assets/_img).
  command = "node scripts/build-images.mjs"

# Serve the admin page at /admin (without trailing slash)
[[redirects]]
  from = "/admin"
  to   = "/admin/index.html"
  status = 200

# Clean URLs for auth pages
[[redirects]]
  from = "/fr/login"
  to   = "/fr/login.html"
  status = 200

[[redirects]]
  from = "/en/login"
  to   = "/en/login.html"
  status = 200

[[redirects]]
  from = "/fr/verify"
  to   = "/fr/verify.html"
  status = 200

[[redirects]]
  from = "/en/verify"
  to   = "/en/verify.html"
  status = 200

[[redirects]]
  from = "/fr/stock"
  to   = "/fr/stock.html"
  status = 200

[[redirects]]
  from = "/en/stock"
  to   = "/en/stock.html"
  status = 200

[[redirects]]
  from = "/setup-staff"
  to   = "/setup-staff.html"
  status = 200

# Doublon supprimé -> page de remerciement canonique
[[redirects]]
  from = "/fr/fr_merci.html"
  to   = "/fr/merci.html"
  status = 301

# "Opportunites" a toujours pointe sur le stock : 301 au lieu d'un meta-refresh
[[redirects]]
  from = "/fr/opportunites.html"
  to   = "/fr/stock.html"
  status = 301

[[redirects]]
  from = "/en/opportunites.html"
  to   = "/en/stock.html"
  status = 301

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Les variantes portent la largeur dans leur nom : leur contenu ne change
# jamais pour une URL donnee, on peut donc les mettre en cache indefiniment.
[[headers]]
  for = "/assets/_img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
