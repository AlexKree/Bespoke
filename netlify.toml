[build]
  functions = "netlify/functions"
  # 1. Produit les variantes WebP servies par le site (assets/_img).
  # 2. Regenere les fiches vehicule, le sitemap et robots.txt : un
  #    enregistrement depuis /admin commite stock.json, ce qui declenche un build.
  command = "node scripts/build-images.mjs && node scripts/build-stock-pages.mjs"

# NB : le timeout des fonctions synchrones (10 s par defaut, 26 s max) n'est PAS
# reglable ici — c'est un parametre du dashboard Netlify, et seulement sur les
# plans qui l'autorisent. Le pre-rapport photo contourne cette limite : la
# fonction `ai-inspection` cree seulement un job (table ai_inspection_jobs) et
# `ai-inspection-run-background` (fonction *background*, plafond 15 min) fait
# l'analyse. Necessite DATABASE_URL et la migration migrations/add-ai-inspection-jobs.sql.

# ── Langue d'arrivee selon le pays de l'IP ───────────────────────────
# Netlify resout le pays a la peripherie ; aucune fonction n'est necessaire.
#
# force = true est indispensable : sans lui, "/" correspond au fichier
# index.html existant et la regle serait ignoree.
#
# 302 et non 301 : une redirection qui depend du visiteur ne doit jamais
# etre mise en cache de facon permanente par un navigateur ou un proxy.
[[redirects]]
  from = "/"
  to = "/fr/index.html"
  status = 302
  force = true
  conditions = {Country = ["FR", "MC", "GP", "MQ", "GF", "RE", "YT", "PM", "BL", "MF", "WF", "PF", "NC"]}

# Tout le reste du monde, y compris quand le pays est indeterminable.
[[redirects]]
  from = "/"
  to = "/en/index.html"
  status = 302
  force = true

# Serve the admin page at /admin (without trailing slash)
[[redirects]]
  from = "/admin"
  to   = "/admin/index.html"
  status = 200

# Clean URLs for auth pages
[[redirects]]
  from = "/fr/login"
  to   = "/fr/login.html"
  status = 200

[[redirects]]
  from = "/en/login"
  to   = "/en/login.html"
  status = 200

[[redirects]]
  from = "/fr/verify"
  to   = "/fr/verify.html"
  status = 200

[[redirects]]
  from = "/en/verify"
  to   = "/en/verify.html"
  status = 200

[[redirects]]
  from = "/fr/stock"
  to   = "/fr/stock.html"
  status = 200

[[redirects]]
  from = "/en/stock"
  to   = "/en/stock.html"
  status = 200

[[redirects]]
  from = "/setup-staff"
  to   = "/setup-staff.html"
  status = 200

# Doublon supprimé -> page de remerciement canonique
[[redirects]]
  from = "/fr/fr_merci.html"
  to   = "/fr/merci.html"
  status = 301

# "Opportunites" a toujours pointe sur le stock : 301 au lieu d'un meta-refresh
[[redirects]]
  from = "/fr/opportunites.html"
  to   = "/fr/stock.html"
  status = 301

[[redirects]]
  from = "/en/opportunites.html"
  to   = "/en/stock.html"
  status = 301

[[redirects]]
  from = "/fr/concierge"
  to   = "/fr/concierge.html"
  status = 200

[[redirects]]
  from = "/fr/import"
  to   = "/fr/import.html"
  status = 200

[[redirects]]
  from = "/fr/inspection"
  to   = "/fr/inspection.html"
  status = 200

[[redirects]]
  from = "/en/concierge"
  to   = "/en/concierge.html"
  status = 200

[[redirects]]
  from = "/en/import"
  to   = "/en/import.html"
  status = 200

[[redirects]]
  from = "/en/inspection"
  to   = "/en/inspection.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Les variantes portent la largeur dans leur nom : leur contenu ne change
# jamais pour une URL donnee, on peut donc les mettre en cache indefiniment.
[[headers]]
  for = "/assets/_img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/.netlify/functions/ai-*"
  [headers.values]
    Cache-Control = "no-store"
